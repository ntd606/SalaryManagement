<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salary Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm p-4 mb-4">
        <h2>User</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Name</label>
                <div class="col-sm-10">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Enter your name" required />
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Age</label>
                <div class="col-sm-10">
                    <input type="number" th:field="*{age}" class="form-control" placeholder="Enter your Age" required />
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Salary</label>
                <div class="col-sm-10">
                    <input type="number" step="any" th:field="*{salary}" class="form-control" placeholder="Enter your Salary" required />
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary" th:text="${user.id == null} ? 'Add' : 'Update'">Add</button>
                <a th:href="@{/}" class="btn btn-warning text-white">Reset Form</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm p-4">
        <h3>List of Users</h3>
        <table class="table table-striped mt-3">
            <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SALARY</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${listUsers}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.name}"></td>
                <td th:text="${u.age}"></td>
                <td th:text="${u.salary}"></td>
                <td>
                    <a th:href="@{/edit/{id}(id=${u.id})}" class="btn btn-success btn-sm">Edit</a>
                    <a th:href="@{/delete/{id}(id=${u.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Remove</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
